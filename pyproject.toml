[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameio-mcp"
version = "0.1.0"
description = "Frame.io MCP server for Claude — post comments, list comments, upload attachments, pull transcripts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Laura Lacurezeanu", email = "example@mail.com" },
]
keywords = ["mcp", "frameio", "claude", "video", "editing", "post-production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27",
    "pydantic>=2.5",
    "click>=8.1",
    "python-dotenv>=1.0",
    "srt>=3.5",
    "webvtt-py>=0.5",
]

[project.optional-dependencies]
# Extras the hosted deployment needs. Local stdio use does not require these:
# OAuth client registrations must outlive any single process, which only matters
# once the server runs behind Claude's OAuth flow on ephemeral infrastructure.
server = [
    "py-key-value-aio[redis]>=0.4",
    "cryptography>=42.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "respx>=0.20",
    "build>=1.0",
    "ruff>=0.6",
]

[project.scripts]
frameio-mcp = "frameio_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/aiscalestudio/frameio-mcp"
Repository = "https://github.com/aiscalestudio/frameio-mcp"
Issues = "https://github.com/aiscalestudio/frameio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/frameio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits a live external service (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
